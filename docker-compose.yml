services:
  app:
    container_name: job-tracker-app
    image: job-tracker-app:latest
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      DATA_DIR: /app/data
    volumes:
      - application_data:/app/data

volumes:
  application_data:
